<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="CLARA mark — closed loop with a live signal">
  <!-- The closed loop -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#016f60" stroke-width="8"/>
  <!-- The live signal travelling the loop -->
  <circle cx="65" cy="24" r="11" fill="#e0a24a" opacity="0.16"/>
  <circle cx="65" cy="24" r="6.5" fill="#e0a24a"/>
  <!-- The core / outcome -->
  <circle cx="50" cy="50" r="4.5" fill="#1bb89e"/>
</svg>
