[project]
name = "clara-api"
version = "0.1.0"
description = "API prototype for the CLARA Feedback-to-Outcome platform."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "langfuse>=2.0.0",
  "PyJWT[crypto]>=2.8.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "pytest-httpx>=0.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E501", "B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
