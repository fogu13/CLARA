[project]
name = "clara-api"
version = "0.1.0"
description = "API prototype for the CLARA Feedback-to-Outcome platform."
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  # <0.129 pins starlette to the validated 0.x line: fastapi 0.129+ moves to
  # starlette 1.x, where include_router no longer flattens APIRoutes into
  # app.routes (breaks the works-council walker) — bump deliberately, not by
  # CI drift.
  "fastapi>=0.115.0,<0.129",
  # [pool]: services/postgres.py imports psycopg_pool for the shared bounded pool.
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.7.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  # Constructor-only usage (Langfuse(public_key, secret_key, host)); v3+ API.
  "langfuse>=3.0.0,<5",
  "PyJWT[crypto]>=2.8.0",
  "langgraph>=1.0.0,<2",
  "langgraph-checkpoint-postgres>=3.0.0,<4",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Opt-in MCP server (python -m app.mcp_server); not a core runtime dependency.
# Ceiling at <2: mcp 2.0.0 removed mcp.server.fastmcp, which app/mcp_server.py
# imports. Verified against the real packages — 1.29.0 still exports FastMCP,
# 2.0.0 raises ModuleNotFoundError. Without the ceiling a clean install (CI)
# resolves to 2.x and fails at collection while local pinned installs pass.
# Lifting it means porting mcp_server.py to the 2.x server API.
mcp = [
  "mcp>=1.2.0,<2",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "pytest-httpx>=0.30.0",
  "mcp>=1.2.0,<2",  # so CI installs and actually tests the MCP server
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E501", "B008"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
