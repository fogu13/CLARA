[project]
name = "clara-api"
version = "0.1.0"
description = "API prototype for the CLARA Feedback-to-Outcome platform."
requires-python = ">=3.9"
dependencies = [
  # <0.129 pins starlette to the validated 0.x line: fastapi 0.129+ moves to
  # starlette 1.x, where include_router no longer flattens APIRoutes into
  # app.routes (breaks the works-council walker) — bump deliberately, not by
  # CI drift.
  "fastapi>=0.115.0,<0.129",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "langfuse>=2.0.0",
  "PyJWT[crypto]>=2.8.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Opt-in MCP server (python -m app.mcp_server); not a core runtime dependency.
mcp = [
  "mcp>=1.2.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "pytest-httpx>=0.30.0",
  "mcp>=1.2.0",  # so CI installs and actually tests the MCP server
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["E501", "B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
