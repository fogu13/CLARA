# Render Blueprint — CLARA API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: clara-api
    runtime: python
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Require auth in production: refuses to boot if neither SUPABASE_URL (JWKS) nor
      # SUPABASE_JWT_SECRET is set, instead of silently treating every caller as owner.
      - key: CLARA_REQUIRE_AUTH
        value: "true"
      - key: AI_BASE_URL
        value: https://api.mistral.ai/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: mistral-small-latest
      - key: APP_CORS_ORIGINS
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
